<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a130f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="آیات فتح دعای نصر" />
    <title>آیات فتح و دعای نصر</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.png" />
    <link rel="apple-touch-icon" href="icons/icon.png" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="bg-mask" aria-hidden="true"></div>

    <div class="mobile-app">
      <header class="top-bar glass">
        <h1><span class="app-mark" aria-hidden="true">✦</span> آیات فتح و دعای نصر</h1>
        <button id="install-app" class="install-btn" hidden>نصب</button>
      </header>

      <div class="package-tabs" id="package-tabs" role="tablist" aria-label="مجموعه‌ها"></div>
      <div id="package-panels">
        <div class="package-content" id="package-content">
          <div class="package-heading">
            <h2 id="package-title"></h2>
            <button class="play-package" id="play-package" type="button" hidden>پخش همه</button>
          </div>

          <div class="track-list" id="track-list" role="group" aria-label="انتخاب اثر"></div>
          <p class="track-status" id="track-status" role="status" hidden></p>
          <main id="verses" class="verses"></main>

          <details class="sources glass" hidden>
            <summary>منابع این اثر</summary>
            <ul id="source-list"></ul>
          </details>

          <div class="track-list" id="track-list-bottom" role="group" aria-label="انتخاب اثر"></div>
        </div>
      </div>
    </div>

    <div class="settings-sheet glass" id="settings-sheet">
      <audio id="audio-player" preload="metadata" hidden></audio>

      <div class="status-row">
        <span id="line-status" class="status-pill">خط ...</span>
        <span id="word-status" class="status-pill">کلمه ...</span>
      </div>

      <div class="slider-grid">
        <label class="slider-field" for="speed">
          <span>سرعت پخش</span>
          <input id="speed" type="range" min="0.75" max="1.5" step="0.05" value="1" />
          <output id="speed-value">۱.۰۰×</output>
        </label>
      </div>

      <label class="switch-line">
        <input id="auto-scroll" type="checkbox" checked />
        <span>اسکرول خودکار روی کلمه فعال</span>
      </label>
    </div>

    <div class="audio-bar glass" id="audio-bar">
      <div class="audio-progress" id="audio-progress" role="slider" aria-label="پیشرفت پخش" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="audio-progress-fill" id="audio-progress-fill"></div>
      </div>
      <div class="player-row">
        <span class="settings-icon" id="settings-btn" role="button" tabindex="0" aria-label="تنظیمات" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        <div class="player-btns">
          <button class="ctrl-btn" id="skip-back" type="button" aria-label="آیه قبل">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="17" y="5" width="3" height="14" rx="1"/><polygon points="5,5 16,12 5,19"/></svg>
          </button>
          <button class="ctrl-btn ctrl-play" id="play-pause" type="button" aria-label="پخش" data-state="paused" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
          <button class="ctrl-btn" id="skip-forward" type="button" aria-label="آیه بعد">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="3" height="14" rx="1"/><polygon points="19,5 8,12 19,19"/></svg>
          </button>
        </div>
        <div class="audio-track">
          <strong id="track-title"></strong>
          <span class="audio-time" id="audio-time">۰:۰۰ / ۰:۰۰</span>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
